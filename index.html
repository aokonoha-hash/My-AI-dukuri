<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>かんたんAIメーカー</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Babel for React in Browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- TensorFlow.js and Models for Machine Learning -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.4"></script>
    
    <style>
        /* 丸みを帯びた見やすいフォント */
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');
        
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f0fdf4; /* 優しい緑色 */
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden; /* iPad等での不要なスクロールを防止 */
            touch-action: none;
        }

        /* スクロールバーを隠す */
        ::-webkit-scrollbar { display: none; }
        
        /* ボタンを押したときのへこむアニメーション */
        .btn-press:active { 
            transform: scale(0.95); 
            box-shadow: none !important;
        }

        /* ふわふわ浮くアニメーション */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-popIn { animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useCallback } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { get, set } from 'https://esm.sh/idb-keyval@6.2.1';

        // ==========================================
        // ユーティリティ関数
        // ==========================================
        
        // 過去データ（単一結果）と新データ（複数結果）の互換性を保つヘルパー
        const getRuleActions = (rule) => {
            if (rule.actions && Array.isArray(rule.actions) && rule.actions.length > 0) {
                return rule.actions;
            }
            if (rule.actionType && rule.actionValue) {
                return [{ type: rule.actionType, value: rule.actionValue }];
            }
            return [];
        };

        // YouTube URL検証・ID抽出用（Shortsや各種URL形式に対応）
        const getYouTubeId = (url) => {
            if(!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        };

        // テキストの表記ゆれを吸収する正規化関数（空白・記号の削除、カタカナ→ひらがな変換）
        // 声質や話し方の違いによる認識揺れを吸収し、確実にマッチさせます
        const normalizeText = (text) => {
            if (!text) return "";
            return text.replace(/[ 　、。！？!?.,]/g, "")
                       .replace(/[\u30a1-\u30f6]/g, match => String.fromCharCode(match.charCodeAt(0) - 0x60));
        };

        // 背景による誤反応を防ぐため、対象物が位置する中央領域のみを切り出す
        const getCenterCroppedCanvas = (sourceImgOrVideo, targetSize = 224, cropFactor = 0.65) => {
            const canvas = document.createElement('canvas');
            canvas.width = targetSize;
            canvas.height = targetSize;
            const ctx = canvas.getContext('2d');

            let srcW = sourceImgOrVideo.videoWidth || sourceImgOrVideo.width || targetSize;
            let srcH = sourceImgOrVideo.videoHeight || sourceImgOrVideo.height || targetSize;

            const cropW = srcW * cropFactor;
            const cropH = srcH * cropFactor;
            const srcX = (srcW - cropW) / 2;
            const srcY = (srcH - cropH) / 2;

            ctx.drawImage(sourceImgOrVideo, srcX, srcY, cropW, cropH, 0, 0, targetSize, targetSize);
            return canvas;
        };

        // 色合いや明るさのバリエーション（データ拡張）を生成して学習用Canvasの配列を返す（中央クロップ優先）
        const createColorVariations = (sourceImgOrVideo) => {
            const variations = [];
            const width = 224;
            const height = 224;
            
            // 中央領域を中心に切り出したキャンバスを取得
            const croppedCvs = getCenterCroppedCanvas(sourceImgOrVideo, width, 0.65);

            // 印刷や撮影環境による色ブレ・明るさ変化を再現するフィルタ群
            const filters = [
                'none',                               // オリジナル
                'brightness(1.25) contrast(1.1)',    // 明るめ・高コントラスト
                'brightness(0.8) contrast(0.95)',    // 暗め
                'saturate(0.6) brightness(1.05)',    // インク薄め・色あせ
                'saturate(1.4) hue-rotate(8deg)'     // 暖色系（照明の違いなど）
            ];

            filters.forEach(filterStr => {
                const cvs = document.createElement('canvas');
                cvs.width = width;
                cvs.height = height;
                const ctx = cvs.getContext('2d');
                ctx.filter = filterStr;
                ctx.drawImage(croppedCvs, 0, 0, width, height);
                variations.push(cvs);
            });
            return variations;
        };

        // 画像をリサイズしてBase64にする
        const resizeImage = (fileOrVideo, width, height, type = 'video') => {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');

                if (type === 'video') {
                    const vRatio = fileOrVideo.videoWidth / fileOrVideo.videoHeight;
                    let dx = 0, dy = 0, dWidth = width, dHeight = height;
                    if (vRatio > 1) {
                        dWidth = height * vRatio;
                        dx = (width - dWidth) / 2;
                    } else {
                        dHeight = width / vRatio;
                        dy = (height - dHeight) / 2;
                    }
                    ctx.drawImage(fileOrVideo, dx, dy, dWidth, dHeight);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                } else {
                    const img = new Image();
                    img.onload = () => {
                        const iRatio = img.width / img.height;
                        let dWidth = width, dHeight = height;
                        if (iRatio > 1) {
                            dHeight = width / iRatio;
                        } else {
                            dWidth = height * iRatio;
                        }
                        canvas.width = dWidth;
                        canvas.height = dHeight;
                        ctx.drawImage(img, 0, 0, dWidth, dHeight);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    const reader = new FileReader();
                    reader.onload = (e) => img.src = e.target.result;
                    reader.readAsDataURL(fileOrVideo);
                }
            });
        };

        // UI用メッセージボックス
        const MessageBox = ({ message, onClose }) => (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-3xl p-8 max-w-md text-center shadow-2xl">
                    <p className="text-2xl font-bold text-gray-800 mb-8 leading-relaxed">{message}</p>
                    <button 
                        onClick={onClose}
                        className="bg-green-500 text-white px-8 py-4 rounded-2xl text-xl font-bold btn-press shadow-lg"
                    >
                        わかった
                    </button>
                </div>
            </div>
        );

        // ==========================================
        // メインアプリケーション
        // ==========================================
        const App = () => {
            const [view, setView] = useState('loading'); // loading, home, editor, player
            const [models, setModels] = useState({ mobilenet: null, knn: null });
            const [projects, setProjects] = useState([]);
            const [currentProject, setCurrentProject] = useState(null);
            const [msg, setMsg] = useState(null);
            
            // プロファイル（ユーザー）管理
            const [profiles, setProfiles] = useState([{ id: 'default', name: 'ゲスト' }]);
            const [currentProfileId, setCurrentProfileId] = useState('default');

            // アプリ起動時の初期化
            useEffect(() => {
                const initApp = async () => {
                    await loadProfiles();

                    try {
                        const mobilenetModel = await mobilenet.load({ version: 2, alpha: 1.0 });
                        const knn = knnClassifier.create();
                        setModels({ mobilenet: mobilenetModel, knn: knn });
                        setView('home');
                    } catch(e) {
                        console.error("Model Load Error", e);
                        setMsg("AIのじゅんびにしっぱいしました。ページをリロードしてください。");
                    }
                };
                initApp();
            }, []);

            // プロファイルの読み込み (IndexedDBのローカルストレージを使用)
            const loadProfiles = async () => {
                try {
                    const loadedProfiles = await get('ai_maker_profiles');
                    if (loadedProfiles && loadedProfiles.length > 0) {
                        setProfiles(loadedProfiles);
                        setCurrentProfileId(loadedProfiles[0].id);
                        loadProjects(loadedProfiles[0].id);
                    } else {
                        const defaultProfiles = [{ id: 'default', name: 'ゲスト' }];
                        await set('ai_maker_profiles', defaultProfiles);
                        setProfiles(defaultProfiles);
                        setCurrentProfileId('default');
                        loadProjects('default');
                    }
                } catch(e) {
                    console.error("Load Profiles Error", e);
                }
            };

            // プロファイルの追加
            const addProfile = async (name) => {
                if (!name.trim()) return;
                const newProfile = { id: 'prof_' + Date.now(), name: name.trim() };
                const newProfiles = [...profiles, newProfile];
                try {
                    await set('ai_maker_profiles', newProfiles);
                    setProfiles(newProfiles);
                    switchProfile(newProfile.id);
                } catch(e) {
                    setMsg("プロファイルのついかにしっぱいしました。");
                }
            };

            // プロファイルの切り替え
            const switchProfile = (profileId) => {
                setCurrentProfileId(profileId);
                loadProjects(profileId);
            };

            // プロジェクト一覧の読み込み
            const loadProjects = async (profileId) => {
                if (!profileId) return;
                try {
                    const list = await get(`ai_maker_projects_${profileId}`) || [];
                    setProjects(list);
                } catch(e) {
                    console.error("Load Projects Error", e);
                }
            };

            // プロジェクトの保存
            const saveProject = async (projectData) => {
                if (!currentProfileId) {
                    setMsg("ほぞんできませんでした。");
                    return;
                }
                try {
                    const list = await get(`ai_maker_projects_${currentProfileId}`) || [];
                    const existingIndex = list.findIndex(p => p.id === projectData.id);
                    if (existingIndex >= 0) {
                        list[existingIndex] = projectData;
                    } else {
                        list.push(projectData);
                    }
                    await set(`ai_maker_projects_${currentProfileId}`, list);
                    loadProjects(currentProfileId);
                    setMsg("ほぞんしました！");
                } catch(e) {
                    console.error("Save Error", e);
                    setMsg("エラーがおきました。容量オーバーの可能性があります。");
                }
            };

            // プロジェクトの削除
            const deleteProject = async (projectId) => {
                if (!currentProfileId) return;
                try {
                    const list = await get(`ai_maker_projects_${currentProfileId}`) || [];
                    const newList = list.filter(p => p.id !== projectId);
                    await set(`ai_maker_projects_${currentProfileId}`, newList);
                    loadProjects(currentProfileId);
                } catch(e) {
                    console.error("Delete Error", e);
                }
            };

            // 保存したプロジェクトを開く前の学習処理
            const openProject = async (project) => {
                setView('loading');
                setCurrentProject(project);
                
                models.knn.clearAllClasses();
                
                if (project.rules && project.rules.length > 0) {
                    for (const rule of project.rules) {
                        if ((rule.triggerType === 'camera' || rule.triggerType === 'image') && rule.triggerImages && rule.triggerImages.length > 0) {
                            for (const imgBase64 of rule.triggerImages) {
                                await new Promise((resolve) => {
                                    const img = new Image();
                                    img.onload = () => {
                                        const canvases = createColorVariations(img);
                                        canvases.forEach(cvs => {
                                            const tensor = tf.browser.fromPixels(cvs);
                                            const activation = models.mobilenet.infer(tensor, true);
                                            models.knn.addExample(activation, rule.id);
                                            tensor.dispose();
                                        });
                                        resolve();
                                    };
                                    img.src = imgBase64;
                                });
                            }
                        }
                    }
                }
                setView('editor');
            };

            return (
                <div className="w-screen h-screen overflow-hidden relative text-gray-800 flex flex-col">
                    {msg && <MessageBox message={msg} onClose={() => setMsg(null)} />}
                    
                    {view === 'loading' && (
                        <div className="flex flex-col items-center justify-center h-full bg-green-50">
                            <div className="w-24 h-24 border-8 border-green-300 border-t-green-600 rounded-full animate-spin mb-8"></div>
                            <h1 className="text-3xl font-bold text-green-700 animate-pulse">じゅんびちゅう...</h1>
                        </div>
                    )}

                    {view === 'home' && (
                        <HomeScreen 
                            projects={projects} 
                            profiles={profiles}
                            currentProfileId={currentProfileId}
                            onSwitchProfile={switchProfile}
                            onAddProfile={addProfile}
                            onCreateNew={() => {
                                setCurrentProject({
                                    id: 'proj_' + Date.now(),
                                    name: 'あたらしいAI ' + new Date().toLocaleDateString(),
                                    rules: [],
                                    createdAt: Date.now()
                                });
                                models.knn.clearAllClasses();
                                setView('editor');
                            }}
                            onOpenProject={openProject}
                            onDeleteProject={deleteProject}
                        />
                    )}

                    {view === 'editor' && (
                        <EditorScreen 
                            project={currentProject} 
                            setProject={setCurrentProject}
                            models={models}
                            onBack={() => setView('home')}
                            onSave={() => saveProject(currentProject)}
                            onPlay={() => setView('player')}
                            showMessage={setMsg}
                        />
                    )}

                    {view === 'player' && (
                        <PlayerScreen 
                            project={currentProject}
                            models={models}
                            onBack={() => setView('editor')}
                        />
                    )}
                </div>
            );
        };

        // ==========================================
        // ホーム画面
        // ==========================================
        const HomeScreen = ({ projects, profiles, currentProfileId, onSwitchProfile, onAddProfile, onCreateNew, onOpenProject, onDeleteProject }) => {
            const [showProfileMenu, setShowProfileMenu] = useState(false);
            const [newProfileName, setNewProfileName] = useState("");
            const currentProfile = profiles.find(p => p.id === currentProfileId);

            const handleAddProfile = () => {
                onAddProfile(newProfileName);
                setNewProfileName("");
                setShowProfileMenu(false);
            };

            return (
                <div className="h-full w-full flex flex-col items-center p-8 bg-green-50 relative">
                    
                    {/* プロファイル切り替えUI */}
                    <div className="absolute top-6 right-6 z-20">
                        <button 
                            onClick={() => setShowProfileMenu(!showProfileMenu)}
                            className="bg-white border-4 border-green-300 text-green-800 px-6 py-3 rounded-full text-xl font-bold shadow-md flex items-center gap-2 btn-press"
                        >
                            👤 {currentProfile ? currentProfile.name : 'だれか'} ▽
                        </button>
                        
                        {showProfileMenu && (
                            <div className="absolute top-full right-0 mt-2 w-72 bg-white rounded-3xl shadow-2xl border-4 border-green-200 overflow-hidden flex flex-col z-30">
                                <div className="p-4 bg-green-50 border-b-2 border-green-100 font-bold text-gray-600">使う人をえらぶ</div>
                                <div className="max-h-60 overflow-y-auto">
                                    {profiles.map(p => (
                                        <button key={p.id} onClick={() => { onSwitchProfile(p.id); setShowProfileMenu(false); }} className={`w-full text-left px-6 py-4 font-bold text-xl hover:bg-green-100 ${p.id === currentProfileId ? 'bg-green-200 text-green-900' : 'text-gray-700'}`}>
                                            {p.name}
                                        </button>
                                    ))}
                                </div>
                                <div className="p-4 bg-gray-50 border-t-2 border-gray-100">
                                    <input 
                                        type="text" 
                                        placeholder="新しい人のなまえ" 
                                        value={newProfileName}
                                        onChange={(e) => setNewProfileName(e.target.value)}
                                        className="w-full px-4 py-2 border-2 border-gray-300 rounded-xl mb-2"
                                    />
                                    <button onClick={handleAddProfile} className="w-full bg-blue-500 text-white font-bold py-2 rounded-xl btn-press">
                                        ➕ ついかする
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    <h1 className="text-5xl font-extrabold text-green-700 mt-10 mb-12 animate-float drop-shadow-md">
                        🤖 かんたんAIメーカー
                    </h1>
                    
                    <button 
                        onClick={onCreateNew}
                        className="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-3xl font-bold py-8 px-12 rounded-[2rem] shadow-[0_10px_0_#b45309] btn-press mb-12 transition-colors"
                    >
                        ✨ あたらしいAIをつくる
                    </button>

                    <div className="w-full max-w-4xl bg-white rounded-[3rem] shadow-xl p-8 flex-1 overflow-y-auto mb-10 border-4 border-green-200">
                        <h2 className="text-2xl font-bold text-gray-500 mb-6 border-b-2 border-gray-100 pb-2">💾 ほぞんしたAI</h2>
                        {projects.length === 0 ? (
                            <p className="text-center text-gray-400 text-xl py-10">まだ AI はありません</p>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {projects.map(p => (
                                    <div key={p.id} className="bg-green-50 rounded-3xl p-6 flex justify-between items-center shadow-md border-2 border-green-100">
                                        <div className="flex-1 cursor-pointer" onClick={() => onOpenProject(p)}>
                                            <h3 className="text-2xl font-bold text-green-800">{p.name}</h3>
                                            <p className="text-gray-500 mt-2">ルール: {p.rules ? p.rules.length : 0} こ</p>
                                        </div>
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); onDeleteProject(p.id); }}
                                            className="bg-red-200 hover:bg-red-300 text-red-700 p-4 rounded-full ml-4 transition-colors btn-press"
                                        >
                                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ==========================================
        // エディター画面
        // ==========================================
        const EditorScreen = ({ project, setProject, models, onBack, onSave, onPlay, showMessage }) => {
            const [editingRule, setEditingRule] = useState(null);

            const deleteRule = (ruleId) => {
                const newRules = project.rules.filter(r => r.id !== ruleId);
                setProject({ ...project, rules: newRules });
                try {
                    if (models.knn.getClassExampleCount()[ruleId]) {
                        models.knn.clearClass(ruleId);
                    }
                } catch (e) {
                    console.warn("Could not clear class:", e);
                }
            };

            const saveRule = (ruleData) => {
                const existingIndex = project.rules.findIndex(r => r.id === ruleData.id);
                let newRules;
                if (existingIndex >= 0) {
                    newRules = [...project.rules];
                    newRules[existingIndex] = ruleData;
                } else {
                    newRules = [...project.rules, ruleData];
                }
                setProject({ ...project, rules: newRules });
                setEditingRule(null);
            };

            const getTriggerLabel = (rule) => {
                if (rule.triggerType === 'camera') {
                    return (
                        <div className="flex items-center gap-3">
                            <span className="text-4xl">📷</span>
                            {rule.triggerImages && rule.triggerImages.length > 0 ? (
                                <img src={rule.triggerImages[0]} className="w-20 h-20 object-cover rounded-xl border-2 border-blue-200" alt="Camera Trigger" />
                            ) : (
                                <span className="text-xl text-blue-900 font-bold">カメラ画像</span>
                            )}
                        </div>
                    );
                } else if (rule.triggerType === 'voice') {
                    return (
                        <div className="flex items-center gap-3">
                            <span className="text-4xl">🗣️</span>
                            <span className="text-2xl text-blue-900 font-bold">「{rule.triggerValue}」</span>
                        </div>
                    );
                } else if (rule.triggerType === 'image') {
                    return (
                        <div className="flex items-center gap-3">
                            <span className="text-4xl">🖼️</span>
                            {rule.triggerImages && rule.triggerImages.length > 0 ? (
                                <img src={rule.triggerImages[0]} className="w-20 h-20 object-cover rounded-xl border-2 border-blue-200" alt="Uploaded Trigger" />
                            ) : (
                                <span className="text-xl text-blue-900 font-bold">保存画像</span>
                            )}
                        </div>
                    );
                }
                return null;
            };

            const getActionLabel = (rule) => {
                const actions = getRuleActions(rule);
                return (
                    <div className="flex flex-wrap items-center justify-center gap-3">
                        {actions.map((act, i) => {
                            const valCount = act.values ? act.values.length : (act.value ? 1 : 0);
                            return (
                                <div key={i} className="flex items-center gap-2 bg-white px-3 py-2 rounded-xl shadow-sm border border-pink-200">
                                    {act.type === 'image' && <><span className="text-2xl">🖼️</span><span className="text-sm font-bold text-pink-800">画像 ({valCount})</span></>}
                                    {act.type === 'voice' && <><span className="text-2xl">🗣️</span><span className="text-sm font-bold text-pink-800">言葉 ({valCount})</span></>}
                                    {act.type === 'audio' && <><span className="text-2xl">🎵</span><span className="text-sm font-bold text-blue-800">音 ({valCount})</span></>}
                                    {act.type === 'video' && <><span className="text-2xl">🎬</span><span className="text-sm font-bold text-purple-800">動画 ({valCount})</span></>}
                                    {act.type === 'youtube' && <><span className="text-2xl">▶️</span><span className="text-sm font-bold text-red-800">YT ({valCount})</span></>}
                                </div>
                            );
                        })}
                    </div>
                );
            };

            return (
                <div className="h-full w-full flex flex-col bg-gray-50 relative">
                    {/* 上部バー */}
                    <div className="bg-white px-8 py-4 flex justify-between items-center shadow-md z-10 border-b-4 border-green-200">
                        <button onClick={onBack} className="bg-gray-200 text-gray-700 text-xl font-bold px-6 py-3 rounded-full btn-press">
                            ◀ もどる
                        </button>
                        <input 
                            type="text" 
                            value={project.name}
                            onChange={(e) => setProject({ ...project, name: e.target.value })}
                            className="text-2xl font-bold text-center border-b-2 border-green-400 focus:outline-none px-4 py-1"
                        />
                        <button onClick={onSave} className="bg-blue-500 text-white text-xl font-bold px-8 py-3 rounded-full btn-press shadow-md">
                            💾 ほぞん
                        </button>
                    </div>

                    {/* ルール一覧 */}
                    <div className="flex-1 p-8 overflow-y-auto flex flex-col items-center">
                        {project.rules.length === 0 ? (
                            <div className="text-center mt-20">
                                <p className="text-3xl text-gray-400 font-bold mb-8">AIにルールをおしえよう！</p>
                            </div>
                        ) : (
                            <div className="w-full max-w-5xl space-y-6 mb-24">
                                {project.rules.map((rule, idx) => (
                                    <div key={rule.id} className="bg-white rounded-3xl p-6 shadow-lg border-4 border-gray-100 flex items-center justify-between">
                                        <div className="flex items-center text-3xl font-bold text-gray-700 w-full">
                                            <span className="bg-green-100 text-green-700 min-w-[3rem] h-12 rounded-full flex items-center justify-center mr-4 text-xl">{idx + 1}</span>
                                            
                                            <div className="flex-1 flex items-center bg-blue-50 rounded-2xl p-4 min-h-[7rem] justify-center overflow-hidden">
                                                {getTriggerLabel(rule)}
                                            </div>
                                            
                                            <span className="mx-4 text-4xl text-gray-300">➡</span>
                                            
                                            <div className="flex-1 flex flex-col items-center bg-pink-50 rounded-2xl p-4 min-h-[7rem] justify-center overflow-hidden">
                                                {getActionLabel(rule)}
                                            </div>
                                        </div>
                                        <div className="flex flex-col gap-2 ml-6">
                                            <button onClick={() => setEditingRule(rule)} className="bg-blue-100 text-blue-700 font-bold px-5 py-3 rounded-2xl btn-press whitespace-nowrap text-xl">
                                                ✏️ へんしゅう
                                            </button>
                                            <button onClick={() => deleteRule(rule.id)} className="bg-red-100 text-red-500 font-bold px-5 py-3 rounded-2xl btn-press whitespace-nowrap text-xl">
                                                けす
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* 下部固定ボタン */}
                    <div className="absolute bottom-8 w-full flex justify-center space-x-8 px-8 pointer-events-none">
                        <button 
                            onClick={() => setEditingRule({ id: 'rule_' + Date.now(), triggerType: 'camera', triggerValue: '', triggerImages: [], actions: [{ type: 'image', value: '' }] })}
                            className="bg-green-500 text-white text-3xl font-bold py-6 px-10 rounded-full shadow-[0_8px_0_#166534] btn-press pointer-events-auto"
                        >
                            ➕ ルールをふやす
                        </button>
                        <button 
                            onClick={onPlay}
                            disabled={project.rules.length === 0}
                            className={`text-3xl font-bold py-6 px-12 rounded-full pointer-events-auto btn-press ${project.rules.length > 0 ? 'bg-yellow-400 text-yellow-950 shadow-[0_8px_0_#b45309]' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}
                        >
                            ▶️ あそぶ！
                        </button>
                    </div>

                    {/* ルール作成・編集モーダル */}
                    {editingRule && (
                        <RuleCreatorModal 
                            models={models} 
                            initialRule={editingRule}
                            onClose={() => setEditingRule(null)} 
                            onComplete={saveRule} 
                            showMessage={showMessage}
                        />
                    )}
                </div>
            );
        };

        // ==========================================
        // ルール作成・編集（1画面UI・複数結果対応）
        // ==========================================
        const RuleCreatorModal = ({ models, initialRule, onClose, onComplete, showMessage }) => {
            const initialActions = getRuleActions(initialRule || {});
            const initialTypes = initialActions.length > 0 ? initialActions.map(a => a.type) : ['image'];
            
            const [selectedActionTypes, setSelectedActionTypes] = useState(initialTypes);
            
            // 既存データ（単一値）と新規データ（配列）の互換を保って初期化
            const getInitialValues = (type) => {
                const act = initialActions.find(a => a.type === type);
                if (act) {
                    if (act.values && act.values.length > 0) return act.values;
                    if (act.value) return [act.value];
                }
                return [];
            };

            const [actionValues, setActionValues] = useState({
                image: getInitialValues('image'),
                voice: getInitialValues('voice'),
                audio: getInitialValues('audio'),
                video: getInitialValues('video'),
                youtube: getInitialValues('youtube')
            });

            // 複数結果用の追加・削除・更新ハンドラ
            const handleAddActionValue = (type, defaultValue = '') => {
                setActionValues(prev => ({...prev, [type]: [...prev[type], defaultValue]}));
            };
            const handleRemoveActionValue = (type, index) => {
                setActionValues(prev => ({...prev, [type]: prev[type].filter((_, i) => i !== index)}));
            };
            const handleUpdateActionValue = (type, index, value) => {
                setActionValues(prev => {
                    const newArr = [...prev[type]];
                    newArr[index] = value;
                    return {...prev, [type]: newArr};
                });
            };

            const [ruleData, setRuleData] = useState({ 
                id: initialRule?.id || ('rule_' + Date.now()), 
                triggerType: initialRule?.triggerType || 'camera', 
                triggerValue: initialRule?.triggerValue || '', 
                triggerImages: initialRule?.triggerImages || []
            });
            
            const [cameraFacing, setCameraFacing] = useState('environment'); // 'environment' (外カメラ) or 'user' (インカメラ)
            const [cameraStream, setCameraStream] = useState(null);
            const videoRef = useRef(null);
            const [learnCount, setLearnCount] = useState(models.knn.getClassExampleCount()[ruleData.id] || 0);
            const isLearningRef = useRef(false);

            useEffect(() => {
                if (initialRule && initialRule.triggerImages && initialRule.triggerImages.length > 0) {
                    try {
                        if (models.knn.getClassExampleCount()[ruleData.id]) {
                            models.knn.clearClass(ruleData.id);
                        }
                    } catch (e) {
                        console.warn("Could not clear class:", e);
                    }
                    initialRule.triggerImages.forEach(imgBase64 => {
                        const img = new Image();
                        img.onload = () => {
                            const canvases = createColorVariations(img);
                            canvases.forEach(cvs => {
                                const tensor = tf.browser.fromPixels(cvs);
                                const activation = models.mobilenet.infer(tensor, true);
                                models.knn.addExample(activation, ruleData.id);
                                tensor.dispose();
                            });
                            setLearnCount(models.knn.getClassExampleCount()[ruleData.id] || 0);
                        };
                        img.src = imgBase64;
                    });
                }
            }, []);

            const toggleActionType = (type) => {
                if (selectedActionTypes.includes(type)) {
                    if (selectedActionTypes.length === 1) {
                        showMessage("結果は１つ以上選んでね！");
                        return;
                    }
                    setSelectedActionTypes(selectedActionTypes.filter(t => t !== type));
                } else {
                    setSelectedActionTypes([...selectedActionTypes, type]);
                }
            };

            useEffect(() => {
                if (ruleData.triggerType === 'camera') {
                    const startCamera = async () => {
                        try {
                            if (cameraStream) {
                                cameraStream.getTracks().forEach(t => t.stop());
                            }
                            const stream = await navigator.mediaDevices.getUserMedia({ 
                                video: { facingMode: cameraFacing } 
                            });
                            setCameraStream(stream);
                            if (videoRef.current) videoRef.current.srcObject = stream;
                        } catch (e) {
                            showMessage("カメラが使えません。");
                        }
                    };
                    startCamera();
                } else {
                    if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
                }
                return () => {
                    if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
                };
            }, [ruleData.triggerType, cameraFacing]);

            const handleLearnStart = () => { isLearningRef.current = true; learnFrame(); };
            const handleLearnStop = () => { isLearningRef.current = false; };
            const learnFrame = async () => {
                if (!isLearningRef.current || !videoRef.current || videoRef.current.readyState < 2) return;
                
                const canvases = createColorVariations(videoRef.current);
                canvases.forEach(cvs => {
                    const tensor = tf.browser.fromPixels(cvs);
                    const activation = models.mobilenet.infer(tensor, true);
                    models.knn.addExample(activation, ruleData.id);
                    tensor.dispose();
                });

                if (ruleData.triggerImages.length < 10 && Math.random() > 0.5) {
                    const base64 = await resizeImage(videoRef.current, 224, 224, 'video');
                    setRuleData(prev => ({...prev, triggerImages: [...prev.triggerImages, base64]}));
                }
                setLearnCount(models.knn.getClassExampleCount()[ruleData.id] || 0);
                setTimeout(learnFrame, 120);
            };

            const handleFileUpload = async (e, isTrigger, type, index = -1, maxSizeKB = 10000) => {
                const file = e.target.files[0];
                if (!file) return;
                
                if (file.size > maxSizeKB * 1024) {
                    const mbSize = Math.floor(maxSizeKB / 1000);
                    showMessage(`ファイルが大きすぎます（${mbSize > 0 ? mbSize + 'MB' : maxSizeKB + 'KB'} 以下にしてください）。`);
                    return;
                }

                if (type === 'image') {
                    const base64 = await resizeImage(file, 800, 800, 'image');
                    if (isTrigger) {
                        setRuleData(prev => ({...prev, triggerImages: [base64]}));
                        try {
                            if (models.knn.getClassExampleCount()[ruleData.id]) {
                                models.knn.clearClass(ruleData.id);
                            }
                        } catch (e) {
                            console.warn("Could not clear class:", e);
                        }

                        const img = new Image();
                        img.onload = () => {
                            const canvases = createColorVariations(img);
                            canvases.forEach(cvs => {
                                const tensor = tf.browser.fromPixels(cvs);
                                const activation = models.mobilenet.infer(tensor, true);
                                models.knn.addExample(activation, ruleData.id);
                                tensor.dispose();
                            });
                            setLearnCount(models.knn.getClassExampleCount()[ruleData.id] || 0);
                        };
                        img.src = base64;
                    } else {
                        if (index === -1) {
                            handleAddActionValue('image', base64);
                        } else {
                            handleUpdateActionValue('image', index, base64);
                        }
                    }
                } else if (type === 'video' || type === 'audio') {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        if (index === -1) {
                            handleAddActionValue(type, event.target.result);
                        } else {
                            handleUpdateActionValue(type, index, event.target.result);
                        }
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleComplete = () => {
                if (ruleData.triggerType === 'camera' && learnCount === 0) return showMessage("カメラで画像を学習させてください。");
                if (ruleData.triggerType === 'voice' && !ruleData.triggerValue.trim()) return showMessage("合図の言葉を入力してください。");
                if (ruleData.triggerType === 'image' && ruleData.triggerImages.length === 0) return showMessage("合図の画像をアップロードしてください。");
                
                const actions = [];
                for (let type of selectedActionTypes) {
                    const vals = actionValues[type].filter(v => typeof v === 'string' && v.trim() !== '');
                    if (vals.length === 0) {
                        if (type === 'voice') return showMessage("しゃべる言葉を入力してください。");
                        if (type === 'image') return showMessage("結果の画像をアップロードしてください。");
                        if (type === 'audio') return showMessage("結果の音声をアップロードしてください。");
                        if (type === 'video') return showMessage("結果の動画をアップロードしてください。");
                        if (type === 'youtube') return showMessage("正しいYouTubeのリンクを入力してください。");
                    }
                    if (type === 'youtube' && !vals.every(v => getYouTubeId(v))) {
                        return showMessage("正しくないYouTubeリンクが含まれています。");
                    }
                    actions.push({ type, values: vals, value: vals[0] });
                }

                if (actions.length === 0) return showMessage("結果を１つ以上設定してください。");

                onComplete({
                    ...ruleData,
                    actions: actions,
                    actionType: actions[0].type,
                    actionValue: actions[0].value
                });
            };

            return (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
                    <div className="bg-white w-full max-w-6xl rounded-[3rem] shadow-2xl overflow-hidden flex flex-col h-[85vh]">
                        {/* ヘッダー */}
                        <div className="bg-green-100 px-8 py-4 flex justify-between items-center border-b-4 border-green-200">
                            <h2 className="text-3xl font-bold text-green-800">
                                {initialRule && initialRule.triggerImages.length > 0 ? 'ルールをへんしゅうする' : 'ルールをつくる'}
                            </h2>
                            <button onClick={onClose} className="text-gray-500 text-5xl leading-none hover:text-red-500">&times;</button>
                        </div>

                        {/* メイン設定（2カラム layout） */}
                        <div className="flex-1 p-6 grid grid-cols-1 md:grid-cols-2 gap-6 overflow-y-auto bg-gray-50">
                            
                            {/* 左カラム：合図（ひだり） */}
                            <div className="bg-blue-50/70 p-6 rounded-3xl border-4 border-blue-200 flex flex-col items-center">
                                <h3 className="text-2xl font-extrabold text-blue-900 mb-4 bg-blue-200 px-6 py-2 rounded-full">
                                    1. これをみたら / きいたら（合図）
                                </h3>

                                <div className="flex gap-2 mb-6 w-full justify-center">
                                    <button 
                                        onClick={() => setRuleData({ ...ruleData, triggerType: 'camera' })}
                                        className={`px-4 py-3 rounded-2xl text-lg font-bold btn-press flex items-center gap-2 ${ruleData.triggerType === 'camera' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-gray-700 border-2 border-blue-200'}`}
                                    >
                                        📷 カメラで見る
                                    </button>
                                    <button 
                                        onClick={() => setRuleData({ ...ruleData, triggerType: 'voice' })}
                                        className={`px-4 py-3 rounded-2xl text-lg font-bold btn-press flex items-center gap-2 ${ruleData.triggerType === 'voice' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-gray-700 border-2 border-blue-200'}`}
                                    >
                                        🗣️ 声を聞く
                                    </button>
                                    <button 
                                        onClick={() => setRuleData({ ...ruleData, triggerType: 'image' })}
                                        className={`px-4 py-3 rounded-2xl text-lg font-bold btn-press flex items-center gap-2 ${ruleData.triggerType === 'image' ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-gray-700 border-2 border-blue-200'}`}
                                    >
                                        🖼️ 画像
                                    </button>
                                </div>

                                {/* カメラ撮影 */}
                                {ruleData.triggerType === 'camera' && (
                                    <div className="flex flex-col items-center w-full">
                                        <div className="flex justify-end w-full mb-2">
                                            <button 
                                                onClick={() => setCameraFacing(prev => prev === 'environment' ? 'user' : 'environment')}
                                                className="bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold px-4 py-2 rounded-xl text-sm btn-press shadow-sm"
                                            >
                                                🔄 カメラきりかえ ({cameraFacing === 'environment' ? 'そとカメラ' : 'インカメラ'})
                                            </button>
                                        </div>
                                        <div className="w-full h-52 bg-black rounded-2xl overflow-hidden relative shadow-inner mb-3">
                                            <video ref={videoRef} autoPlay playsInline muted className={`w-full h-full object-cover ${cameraFacing === 'user' ? '-scale-x-100' : ''}`}></video>
                                            {/* 中央ガイド枠（背景ノイズを排除して学習するためのフォーカス枠） */}
                                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                                <div className="w-36 h-36 border-4 border-dashed border-yellow-300 rounded-2xl bg-yellow-400/20 flex items-center justify-center text-yellow-100 font-bold text-xs text-center p-2 shadow-lg">
                                                    ここに合図を<br/>あわせてね！
                                                </div>
                                            </div>
                                        </div>
                                        <button 
                                            onMouseDown={handleLearnStart} onMouseUp={handleLearnStop}
                                            onTouchStart={handleLearnStart} onTouchEnd={handleLearnStop}
                                            className="w-full bg-blue-500 active:bg-blue-700 text-white text-2xl font-extrabold py-4 rounded-2xl shadow-lg btn-press mb-2"
                                        >
                                            👆 おしている間 おぼえる
                                        </button>
                                        <p className="text-blue-900 font-bold text-lg">おぼえた数: {learnCount} こ</p>
                                    </div>
                                )}

                                {/* 声（文字入力） */}
                                {ruleData.triggerType === 'voice' && (
                                    <div className="w-full flex flex-col items-center my-auto">
                                        <p className="text-xl font-bold text-gray-700 mb-4">ききとる言葉を入れてね</p>
                                        <input 
                                            type="text" 
                                            placeholder="例：こんにちは" 
                                            value={ruleData.triggerValue}
                                            onChange={(e) => setRuleData({ ...ruleData, triggerValue: e.target.value })}
                                            className="w-full text-center text-3xl font-bold p-4 border-4 border-blue-300 rounded-2xl focus:outline-none"
                                        />
                                    </div>
                                )}

                                {/* 保存画像アップロード */}
                                {ruleData.triggerType === 'image' && (
                                    <div className="w-full flex flex-col items-center justify-center my-auto">
                                        {ruleData.triggerImages.length > 0 ? (
                                            <img src={ruleData.triggerImages[0]} className="w-44 h-44 object-cover rounded-2xl border-4 border-blue-300 shadow-md mb-4" alt="Uploaded trigger" />
                                        ) : (
                                            <div className="w-44 h-44 bg-gray-200 border-4 border-dashed border-gray-400 rounded-2xl flex items-center justify-center mb-4 text-gray-500 font-bold">
                                                画像なし
                                            </div>
                                        )}
                                        <label className="bg-blue-500 text-white px-8 py-4 rounded-2xl text-xl font-bold cursor-pointer btn-press shadow-md">
                                            📁 画像をえらぶ
                                            <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, true, 'image')} className="hidden" />
                                        </label>
                                    </div>
                                )}
                            </div>

                            {/* 右カラム：結果（みぎ） */}
                            <div className="bg-pink-50/70 p-6 rounded-3xl border-4 border-pink-200 flex flex-col items-center">
                                <h3 className="text-2xl font-extrabold text-pink-900 mb-4 bg-pink-200 px-6 py-2 rounded-full">
                                    2. こうする！（結果・複数えらべる）
                                </h3>

                                {/* 結果種別の複数選択トグル */}
                                <div className="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-6 w-full">
                                    <button 
                                        onClick={() => toggleActionType('image')}
                                        className={`px-3 py-3 rounded-2xl text-base font-bold btn-press flex items-center justify-center gap-2 ${selectedActionTypes.includes('image') ? 'bg-pink-600 text-white shadow-md' : 'bg-white text-gray-700 border-2 border-pink-200'}`}
                                    >
                                        🖼️ 画像
                                    </button>
                                    <button 
                                        onClick={() => toggleActionType('voice')}
                                        className={`px-3 py-3 rounded-2xl text-base font-bold btn-press flex items-center justify-center gap-2 ${selectedActionTypes.includes('voice') ? 'bg-pink-600 text-white shadow-md' : 'bg-white text-gray-700 border-2 border-pink-200'}`}
                                    >
                                        🗣️ 言葉
                                    </button>
                                    <button 
                                        onClick={() => toggleActionType('audio')}
                                        className={`px-3 py-3 rounded-2xl text-base font-bold btn-press flex items-center justify-center gap-2 ${selectedActionTypes.includes('audio') ? 'bg-pink-600 text-white shadow-md' : 'bg-white text-gray-700 border-2 border-pink-200'}`}
                                    >
                                        🎵 音
                                    </button>
                                    <button 
                                        onClick={() => toggleActionType('video')}
                                        className={`px-3 py-3 rounded-2xl text-base font-bold btn-press flex items-center justify-center gap-2 ${selectedActionTypes.includes('video') ? 'bg-pink-600 text-white shadow-md' : 'bg-white text-gray-700 border-2 border-pink-200'}`}
                                    >
                                        🎬 動画
                                    </button>
                                    <button 
                                        onClick={() => toggleActionType('youtube')}
                                        className={`px-3 py-3 rounded-2xl text-base font-bold btn-press flex items-center justify-center gap-2 ${selectedActionTypes.includes('youtube') ? 'bg-pink-600 text-white shadow-md' : 'bg-white text-gray-700 border-2 border-pink-200'}`}
                                    >
                                        ▶️ YT
                                    </button>
                                </div>

                                {/* 設定フォーム一覧 */}
                                <div className="w-full space-y-4 overflow-y-auto max-h-[36vh] p-2">
                                    
                                    {/* 画像設定 */}
                                    {selectedActionTypes.includes('image') && (
                                        <div className="bg-white p-4 rounded-2xl border-2 border-pink-200 flex flex-col gap-3">
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-gray-700 text-sm">🖼️ 画像（ランダム表示）</span>
                                                <label className="bg-pink-100 text-pink-700 px-3 py-1 rounded-lg text-sm font-bold cursor-pointer btn-press">
                                                    ➕ ふやす
                                                    <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, false, 'image', -1)} className="hidden" />
                                                </label>
                                            </div>
                                            {actionValues.image.length === 0 && <span className="text-gray-400 text-sm text-center">画像を追加してください</span>}
                                            <div className="grid grid-cols-2 gap-2">
                                                {actionValues.image.map((val, idx) => (
                                                    <div key={idx} className="relative group">
                                                        <img src={val} className="w-full h-24 object-cover rounded-xl border-2 border-pink-100" alt="Action Image" />
                                                        <button onClick={() => handleRemoveActionValue('image', idx)} className="absolute -top-2 -right-2 bg-red-500 text-white w-8 h-8 rounded-full font-bold shadow-md">✖</button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* しゃべる設定 */}
                                    {selectedActionTypes.includes('voice') && (
                                        <div className="bg-white p-4 rounded-2xl border-2 border-pink-200 flex flex-col gap-2">
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-gray-700 text-sm">🗣️ しゃべる言葉（ランダム）</span>
                                                <button onClick={() => handleAddActionValue('voice')} className="bg-pink-100 text-pink-700 px-3 py-1 rounded-lg text-sm font-bold btn-press">➕ ふやす</button>
                                            </div>
                                            {actionValues.voice.length === 0 && handleAddActionValue('voice')}
                                            {actionValues.voice.map((val, idx) => (
                                                <div key={idx} className="flex items-center gap-2">
                                                    <input 
                                                        type="text" 
                                                        placeholder="例：ねこちゃんだね！" 
                                                        value={val}
                                                        onChange={(e) => handleUpdateActionValue('voice', idx, e.target.value)}
                                                        className="flex-1 text-lg font-bold p-2 border-2 border-pink-200 rounded-xl focus:outline-none"
                                                    />
                                                    <button onClick={() => handleRemoveActionValue('voice', idx)} className="text-red-400 text-2xl font-bold p-2">✖</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {/* 音声ファイル設定 */}
                                    {selectedActionTypes.includes('audio') && (
                                        <div className="bg-white p-4 rounded-2xl border-2 border-pink-200 flex flex-col gap-3">
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-gray-700 text-sm">🎵 音声ファイル（ランダム・最大50MB）</span>
                                                <label className="bg-pink-100 text-pink-700 px-3 py-1 rounded-lg text-sm font-bold cursor-pointer btn-press">
                                                    ➕ ふやす
                                                    <input type="file" accept="audio/*" onChange={(e) => handleFileUpload(e, false, 'audio', -1, 50000)} className="hidden" />
                                                </label>
                                            </div>
                                            {actionValues.audio.length === 0 && <span className="text-gray-400 text-sm text-center">音声ファイルを追加してください</span>}
                                            {actionValues.audio.map((val, idx) => (
                                                <div key={idx} className="flex items-center justify-between bg-blue-50 p-2 rounded-xl border border-blue-100">
                                                    <audio src={val} controls className="h-10 w-full max-w-[200px]" />
                                                    <button onClick={() => handleRemoveActionValue('audio', idx)} className="text-red-400 text-xl font-bold p-2">✖</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {/* 動画設定 */}
                                    {selectedActionTypes.includes('video') && (
                                        <div className="bg-white p-4 rounded-2xl border-2 border-pink-200 flex flex-col gap-3">
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-gray-700 text-sm">🎬 短い動画（ランダム再生・最大50MB）</span>
                                                <label className="bg-pink-100 text-pink-700 px-3 py-1 rounded-lg text-sm font-bold cursor-pointer btn-press">
                                                    ➕ ふやす
                                                    <input type="file" accept="video/*" onChange={(e) => handleFileUpload(e, false, 'video', -1, 50000)} className="hidden" />
                                                </label>
                                            </div>
                                            {actionValues.video.length === 0 && <span className="text-gray-400 text-sm text-center">動画を追加してください</span>}
                                            <div className="grid grid-cols-2 gap-2">
                                                {actionValues.video.map((val, idx) => (
                                                    <div key={idx} className="relative group bg-black rounded-xl overflow-hidden h-24">
                                                        <video src={val} className="w-full h-full object-cover opacity-70" />
                                                        <span className="absolute inset-0 flex items-center justify-center text-white text-xs font-bold">動画OK</span>
                                                        <button onClick={() => handleRemoveActionValue('video', idx)} className="absolute top-1 right-1 bg-red-500 text-white w-6 h-6 rounded-full font-bold shadow-md text-sm leading-none flex items-center justify-center">✖</button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* YouTube設定 */}
                                    {selectedActionTypes.includes('youtube') && (
                                        <div className="bg-white p-4 rounded-2xl border-2 border-pink-200 flex flex-col gap-2">
                                            <div className="flex justify-between items-center">
                                                <span className="font-bold text-gray-700 text-sm">▶️ YouTube リンク（ランダム）</span>
                                                <button onClick={() => handleAddActionValue('youtube')} className="bg-pink-100 text-pink-700 px-3 py-1 rounded-lg text-sm font-bold btn-press">➕ ふやす</button>
                                            </div>
                                            {actionValues.youtube.length === 0 && handleAddActionValue('youtube')}
                                            {actionValues.youtube.map((val, idx) => (
                                                <div key={idx} className="flex items-center gap-2">
                                                    <input 
                                                        type="text" 
                                                        placeholder="URLをペースト..." 
                                                        value={val}
                                                        onChange={(e) => handleUpdateActionValue('youtube', idx, e.target.value)}
                                                        className="flex-1 text-sm font-bold p-2 border-2 border-pink-200 rounded-xl focus:outline-none"
                                                    />
                                                    <button onClick={() => handleRemoveActionValue('youtube', idx)} className="text-red-400 text-2xl font-bold p-2">✖</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                </div>
                            </div>
                        </div>

                        {/* フッター決定ボタン */}
                        <div className="bg-white p-4 flex justify-center border-t-2 border-gray-100">
                            <button 
                                onClick={handleComplete}
                                className="bg-green-500 hover:bg-green-600 text-white text-3xl font-extrabold py-5 px-16 rounded-full shadow-[0_8px_0_#15803d] btn-press"
                            >
                                できた！
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 実行画面（あそぶ！）
        // ==========================================
        const PlayerScreen = ({ project, models, onBack }) => {
            const [activeAction, setActiveAction] = useState(null);
            const activeActionRef = useRef(null);
            activeActionRef.current = activeAction;

            const [cameraFacing, setCameraFacing] = useState('environment'); // 'environment' (外カメラ) or 'user' (インカメラ)
            const videoRef = useRef(null);
            const reqFrameRef = useRef(null);
            const recognitionRef = useRef(null);
            const synthRef = useRef(window.speechSynthesis);

            // 誤反応防止のためのステート
            const isReadyRef = useRef(false);
            const bgLearningCountRef = useRef(0);
            const detectHistoryRef = useRef([]);

            // カメラのストリーム開始と背景クラスの初期化
            useEffect(() => {
                let stream = null;
                const startCamera = async () => {
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: cameraFacing } 
                        });
                        if (videoRef.current) videoRef.current.srcObject = stream;
                    } catch (e) {
                        console.error("Camera Error", e);
                    }
                };
                startCamera();

                // 前回の背景学習データをリセット
                try {
                    if (models.knn.getClassExampleCount()['__background__']) {
                        models.knn.clearClass('__background__');
                    }
                } catch(e) {}

                return () => {
                    if (stream) stream.getTracks().forEach(t => t.stop());
                };
            }, [models, cameraFacing]);

            // 発話読み上げ
            const speakText = (text) => {
                if (synthRef.current) {
                    synthRef.current.cancel();
                    const ut = new SpeechSynthesisUtterance(text);
                    ut.lang = 'ja-JP';
                    ut.rate = 0.9;
                    synthRef.current.speak(ut);
                }
            };

            const executeAction = useCallback((rule, source) => {
                const actions = getRuleActions(rule);
                
                // 複数の設定値がある場合、ランダムに1つ選んで実行（ガチャ機能）
                const resolvedActions = actions.map(act => {
                    const values = act.values || (act.value ? [act.value] : []);
                    if (values.length === 0) return null;
                    const randomValue = values[Math.floor(Math.random() * values.length)];
                    return { type: act.type, value: randomValue };
                }).filter(a => a !== null);

                setActiveAction({ ruleId: rule.id, actions: resolvedActions, source });

                const voiceAct = resolvedActions.find(a => a.type === 'voice');
                if (voiceAct && voiceAct.value) {
                    speakText(voiceAct.value);
                }
            }, []);

            // 画像認識ループ（リアルタイム検知＆画面離脱判定）
            useEffect(() => {
                const loop = async () => {
                    if (videoRef.current && videoRef.current.readyState >= 2 && models.knn.getNumClasses() > 0) {
                        // 背景の影響を減らすため、中央エリアを切り出して推論
                        const croppedCvs = getCenterCroppedCanvas(videoRef.current, 224, 0.65);
                        const tensor = tf.browser.fromPixels(croppedCvs);
                        const activation = models.mobilenet.infer(tensor, true);

                        // 起動直後の15フレームを「背景」として自動学習し、誤発火を防ぐ
                        if (bgLearningCountRef.current < 15) {
                            models.knn.addExample(activation, '__background__');
                            bgLearningCountRef.current += 1;
                            if (bgLearningCountRef.current === 15) {
                                isReadyRef.current = true;
                            }
                            tensor.dispose();
                            reqFrameRef.current = requestAnimationFrame(loop);
                            return;
                        }

                        if (!isReadyRef.current) {
                            tensor.dispose();
                            reqFrameRef.current = requestAnimationFrame(loop);
                            return;
                        }

                        try {
                            const result = await models.knn.predictClass(activation);
                            
                            // 履歴に保存して連続判定を行う（ノイズ除去）
                            detectHistoryRef.current.push(result.label);
                            if (detectHistoryRef.current.length > 4) {
                                detectHistoryRef.current.shift();
                            }
                            
                            // 過去4フレームの判定がすべて同じか確認
                            const isStable = detectHistoryRef.current.length === 4 && detectHistoryRef.current.every(l => l === result.label);
                            
                            // 背景ではなく、安定して高い確率(70%以上)で検知されたら発火
                            if (isStable && result.label !== '__background__' && result.confidences[result.label] >= 0.70) {
                                const matchedRule = project.rules.find(r => r.id === result.label);
                                if (matchedRule) {
                                    if (!activeActionRef.current || activeActionRef.current.ruleId !== matchedRule.id) {
                                        executeAction(matchedRule, matchedRule.triggerType || 'camera');
                                    }
                                }
                            } else {
                                // 背景と判定されたり、判定が不安定な場合は結果を消して待機状態に戻す
                                const current = activeActionRef.current;
                                if (current && (current.source === 'camera' || current.source === 'image')) {
                                    if (result.label === '__background__' || result.confidences[result.label] < 0.5) {
                                        setActiveAction(null);
                                    }
                                }
                            }
                        } catch(e) {
                            console.error("Predict error", e);
                        } finally {
                            tensor.dispose();
                        }
                    }
                    reqFrameRef.current = requestAnimationFrame(loop);
                };
                loop();

                return () => {
                    if (reqFrameRef.current) cancelAnimationFrame(reqFrameRef.current);
                };
            }, [models, project.rules, executeAction]);

            // 音声認識セットアップ
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'ja-JP';
                    recognition.continuous = true;
                    recognition.interimResults = false;

                    recognition.onresult = (event) => {
                        let transcript = "";
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            transcript += event.results[i][0].transcript;
                        }
                        // 正規化して表記揺れ（空白、句読点、カタカナ/ひらがな）を吸収
                        const normalizedTranscript = normalizeText(transcript);

                        const voiceRules = project.rules.filter(r => r.triggerType === 'voice');
                        for (let rule of voiceRules) {
                            if (normalizedTranscript.includes(normalizeText(rule.triggerValue))) {
                                executeAction(rule, 'voice');
                                break;
                            }
                        }
                    };
                    recognition.onend = () => { try { recognition.start(); } catch(e){} };
                    recognitionRef.current = recognition;
                    try { recognition.start(); } catch(e){}
                }

                const unlockAudio = () => {
                    const ut = new SpeechSynthesisUtterance('');
                    synthRef.current.speak(ut);
                    document.removeEventListener('touchstart', unlockAudio);
                };
                document.addEventListener('touchstart', unlockAudio);

                return () => {
                    if (recognitionRef.current) {
                        recognitionRef.current.onend = null;
                        recognitionRef.current.stop();
                    }
                    document.removeEventListener('touchstart', unlockAudio);
                };
            }, [project.rules, executeAction]);

            return (
                <div className="w-full h-full bg-black relative flex items-center justify-center overflow-hidden">
                    {/* 全画面カメラ映像 */}
                    <video ref={videoRef} autoPlay playsInline muted className={`absolute inset-0 w-full h-full object-cover ${cameraFacing === 'user' ? '-scale-x-100' : ''}`}></video>

                    {/* ヘッダーUI（常に最前面） */}
                    <div className="absolute top-6 left-6 z-50 flex gap-4">
                        <button onClick={onBack} className="bg-white/90 text-gray-800 px-6 py-3 rounded-full text-xl font-bold btn-press shadow-2xl border-4 border-green-400">
                            ◀ しゅうりょう
                        </button>
                        <button 
                            onClick={() => setCameraFacing(prev => prev === 'environment' ? 'user' : 'environment')}
                            className="bg-white/90 text-gray-800 px-5 py-3 rounded-full text-lg font-bold btn-press shadow-2xl border-4 border-blue-400"
                        >
                            🔄 {cameraFacing === 'environment' ? 'そとカメラ' : 'インカメラ'}
                        </button>
                    </div>

                    {/* 待機中のニコニコマーク＆案内（ルール非該当時に固定表示） */}
                    {!activeAction && (
                        <div className="absolute bottom-10 z-40 bg-white/95 px-10 py-5 rounded-full shadow-2xl border-4 border-yellow-400 flex items-center gap-4 animate-bounce">
                            <span className="text-5xl">😊</span>
                            <span className="text-4xl font-extrabold text-gray-800">あそびましょう</span>
                        </div>
                    )}

                    {/* 結果のポップアップ表示レイヤー */}
                    {activeAction && (
                        <div className="absolute inset-0 z-40 bg-black/60 flex flex-col items-center justify-center p-6 backdrop-blur-sm animate-popIn overflow-y-auto">
                            
                            <div className="flex flex-col items-center justify-center max-w-[85vw] max-h-[70vh] gap-6 overflow-y-auto my-auto">
                                {(() => {
                                    const actions = activeAction.actions || [];
                                    const imgAct = actions.find(a => a.type === 'image');
                                    const voiceAct = actions.find(a => a.type === 'voice');
                                    const audioAct = actions.find(a => a.type === 'audio');
                                    const videoAct = actions.find(a => a.type === 'video');
                                    const ytAct = actions.find(a => a.type === 'youtube');

                                    return (
                                        <>
                                            {/* 音声ファイル（非表示で自動再生） */}
                                            {audioAct && (
                                                <audio src={audioAct.value} autoPlay />
                                            )}

                                            {/* 動画 */}
                                            {videoAct && (
                                                <video src={videoAct.value} autoPlay playsInline className="max-w-[80vw] max-h-[45vh] rounded-3xl shadow-2xl border-8 border-white bg-black" onEnded={() => setActiveAction(null)}></video>
                                            )}

                                            {/* YouTube */}
                                            {ytAct && (
                                                <div className="w-[85vw] max-w-3xl aspect-video rounded-3xl overflow-hidden shadow-2xl border-8 border-white bg-black">
                                                    <iframe 
                                                        width="100%" 
                                                        height="100%" 
                                                        src={`https://www.youtube.com/embed/${getYouTubeId(ytAct.value)}?autoplay=1&playsinline=1&rel=0`} 
                                                        title="YouTube video player"
                                                        frameBorder="0" 
                                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                                        allowFullScreen
                                                        className="w-full h-full"
                                                    ></iframe>
                                                </div>
                                            )}

                                            {/* 画像 */}
                                            {imgAct && (
                                                <img src={imgAct.value} className="max-w-[80vw] max-h-[45vh] object-contain rounded-3xl shadow-2xl border-8 border-white bg-white" alt="Action" />
                                            )}

                                            {/* 言葉（吹き出し） */}
                                            {voiceAct && (
                                                <div className="bg-white px-10 py-6 rounded-[2.5rem] shadow-2xl border-8 border-pink-300 min-w-[280px] max-w-[80vw] animate-bounce">
                                                    <p className="text-4xl md:text-5xl font-extrabold text-gray-800 text-center leading-relaxed">{voiceAct.value}</p>
                                                </div>
                                            )}
                                        </>
                                    );
                                })()}
                            </div>

                            {/* 手動コントロールボタン */}
                            <div className="mt-6 flex gap-4">
                                <button onClick={() => setActiveAction(null)} className="bg-red-500 text-white px-8 py-3 rounded-full text-xl font-bold shadow-[0_6px_0_#991b1b] btn-press">
                                    ✖ とじる
                                </button>
                                <button onClick={onBack} className="bg-gray-600 text-white px-8 py-3 rounded-full text-xl font-bold shadow-[0_6px_0_#374151] btn-press">
                                    🏠 おわる（もどる）
                                </button>
                            </div>

                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // レンダリング開始
        // ==========================================
        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
